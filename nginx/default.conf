# Nginx reverse proxy - điểm truy cập duy nhất của hệ thống.
#   :8080 (host 8088) -> chuyển hướng sang HTTPS
#   :8443 (host 8443) -> website, /pgadmin/, /grafana/, /prometheus/
#   :8081 (nội bộ)    -> stub_status cho nginx-exporter, healthcheck
# File này nằm trong khối http{} của /etc/nginx/nginx.conf.

server_tokens off;

# Access log JSON để Promtail/Loki parse bằng `| json`
log_format json_access escape=json '{'
  '"time":"$time_iso8601",'
  '"remote_addr":"$remote_addr",'
  '"method":"$request_method",'
  '"uri":"$request_uri",'
  '"protocol":"$server_protocol",'
  '"status":$status,'
  '"bytes_sent":$body_bytes_sent,'
  '"request_time":$request_time,'
  '"upstream_addr":"$upstream_addr",'
  '"upstream_status":"$upstream_status",'
  '"upstream_response_time":"$upstream_response_time",'
  '"host":"$host",'
  '"referer":"$http_referer",'
  '"user_agent":"$http_user_agent"'
'}';
# access_log được khai báo trong từng server{} để ghi đè "access_log ... main" của
# nginx.conf gốc (nếu khai báo ở cấp http thì mỗi request bị ghi 2 lần, 2 định dạng).

# DNS nội bộ của Docker: resolve tên service tại thời điểm request, nhờ đó Nginx
# vẫn khởi động khi một service phía sau (vd Grafana) đang tắt.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# Giới hạn kích thước request và timeout
client_max_body_size 2m;
client_body_buffer_size 64k;
client_body_timeout 15s;
client_header_timeout 15s;
send_timeout 30s;
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 60s;

# Giới hạn tần suất request theo IP
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_status 429;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# HSTS chỉ gửi qua HTTPS và không gửi cho localhost/127.0.0.1: HSTS áp dụng theo
# hostname (mọi cổng), nếu gửi cho "localhost" thì trình duyệt sẽ tự nâng
# http://localhost:8088 lên HTTPS và trang HTTP localhost không mở được.
map "$scheme://$host" $hsts_header {
  ~^https://(localhost|127\.0\.0\.1)$  "";
  ~^https://                            "max-age=31536000";
  default                               "";
}

# ------------------------------------------------ HTTP localhost (dev/demo)
# http://localhost:8088 và http://127.0.0.1:8088 phục vụ trực tiếp bằng HTTP,
# dùng chung các location với HTTPS. Host khác (IP, tên máy) rơi vào server
# default bên dưới và bị chuyển sang HTTPS như trước.
server {
  listen 8080;
  server_name localhost 127.0.0.1;
  access_log /var/log/nginx/access.log json_access;
  keepalive_timeout 30s;

  # Cổng trong container (8080) khác cổng publish (8088): dùng Location tương đối
  # để redirect như /grafana -> /grafana/ không trỏ nhầm sang :8080.
  absolute_redirect off;
  # Kết nối HTTP không mã hóa: bỏ cờ Secure của cookie từ upstream (app, Grafana)
  # để trình duyệt/curl lưu và gửi lại cookie đăng nhập. HTTPS vẫn giữ cờ Secure.
  proxy_cookie_flags ~ nosecure;

  include /etc/nginx/snippets/locations.conf;
}

# --------------------------------------- HTTP host khác -> chuyển sang HTTPS
server {
  listen 8080 default_server;
  server_name _;
  access_log /var/log/nginx/access.log json_access;
  return 301 https://$host:8443$request_uri;
}

# ----------------------------------------------------------------- HTTPS
server {
  listen 8443 ssl;
  http2 on;
  server_name _;
  access_log /var/log/nginx/access.log json_access;

  ssl_certificate     /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1h;
  ssl_session_tickets off;

  keepalive_timeout 30s;

  # Trả lỗi 497 (HTTP gửi vào cổng HTTPS) bằng chuyển hướng sang HTTPS
  error_page 497 =301 https://$host:8443$request_uri;

  include /etc/nginx/snippets/locations.conf;
}

# ------------------------------------------- Nội bộ (không publish ra host)
server {
  listen 8081;
  access_log off;

  location = /stub_status {
    stub_status;
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
  }

  location = /nginx-health {
    return 200 "ok\n";
  }

  location / { return 404; }
}
