# Các location dùng chung cho server HTTPS (:8443) và server HTTP localhost (:8080).
# Được include trong server{} của nginx/default.conf - sửa một chỗ, áp dụng cho cả hai.

# ---- Ứng dụng đặt phòng
set $app_upstream http://app:3000;

# Endpoint nội bộ, không công khai
location = /metrics { return 404; }
location = /healthz { return 404; }

location = /api/admin/login {
  limit_req zone=login burst=5 nodelay;
  include /etc/nginx/snippets/proxy.conf;
  include /etc/nginx/snippets/security-headers.conf;
  add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
  proxy_pass $app_upstream;
}

location /api/ {
  limit_req zone=api burst=40 nodelay;
  include /etc/nginx/snippets/proxy.conf;
  include /etc/nginx/snippets/security-headers.conf;
  add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
  add_header Cache-Control "no-store" always;
  proxy_pass $app_upstream;
}

location / {
  include /etc/nginx/snippets/proxy.conf;
  include /etc/nginx/snippets/security-headers.conf;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  proxy_pass $app_upstream;
}

# ---- pgAdmin (có trang đăng nhập riêng)
location = /pgadmin { return 301 /pgadmin/; }
location /pgadmin/ {
  set $pgadmin_upstream http://pgadmin:5050;
  rewrite ^/pgadmin(/.*)$ $1 break;
  include /etc/nginx/snippets/proxy.conf;
  include /etc/nginx/snippets/security-headers.conf;
  proxy_set_header X-Script-Name /pgadmin;
  proxy_set_header X-Scheme $scheme;
  proxy_redirect off;
  client_max_body_size 50m;     # cho phép import/restore file SQL nhỏ
  proxy_read_timeout 300s;      # truy vấn dài trong Query Tool
  proxy_pass $pgadmin_upstream;
}

# ---- Grafana (có trang đăng nhập riêng, serve_from_sub_path=true)
location = /grafana { return 301 /grafana/; }
location /grafana/ {
  set $grafana_upstream http://grafana:3000;
  include /etc/nginx/snippets/proxy.conf;
  include /etc/nginx/snippets/security-headers.conf;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_pass $grafana_upstream;
}

# ---- Prometheus UI (không có đăng nhập riêng -> bảo vệ bằng Basic Auth)
location = /prometheus { return 301 /prometheus/; }
location /prometheus/ {
  set $prometheus_upstream http://prometheus:9090;
  auth_basic "Prometheus";
  auth_basic_user_file /etc/nginx/htpasswd;
  include /etc/nginx/snippets/proxy.conf;
  include /etc/nginx/snippets/security-headers.conf;
  proxy_pass $prometheus_upstream;
}
