# Security headers dùng chung. Lưu ý: add_header trong location thay thế toàn bộ
# add_header của cấp cha, nên mỗi location phải include lại file này.
# $hsts_header (map trong default.conf) rỗng với HTTP và localhost -> Nginx không gửi header
add_header Strict-Transport-Security $hsts_header always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Header cũ X-XSS-Protection nên tắt theo khuyến nghị OWASP hiện nay
add_header X-XSS-Protection "0" always;
